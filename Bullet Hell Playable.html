<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bullet Hell Playable</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0d1a;--fg:#fff;--accent:#ff3d71}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100%;aspect-ratio:9/16;max-width:100%}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,6,15,.78);text-align:center;padding:24px}
.ov.on{display:flex}
h1{margin:0;font-size:28px}
p{margin:0;opacity:.8}
button{font:700 20px system-ui,sans-serif;border:0;border-radius:14px;padding:14px 32px;background:var(--accent);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hand{font-size:56px;animation:sway 1.4s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(40px)}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ov on" id="intro"><div class="hand">👆</div><h1>Уклоняйся!</h1><p>Води пальцем и выживи 14 секунд</p></div>
  <div class="ov" id="dead"><h1 id="dtxt"></h1><button id="retry">Ещё раз</button></div>
  <div class="ov" id="end"><h1 id="etit"></h1><p id="esub"></p><button id="install">Играть бесплатно</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=640;
cv.width=W;cv.height=H;
const STORE='https://example.com/install'; // замени на ссылку магазина
function cta(){
  try{
    if(window.mraid&&mraid.open)return mraid.open(STORE);
    if(window.ExitApi)return ExitApi.exit();
  }catch(e){}
  window.open(STORE,'_blank');
}
const $=id=>document.getElementById(id);
const T=14;
let st='intro',attempt=0,t=0,bul=[],parts=[],P={x:W/2,y:H-100},acc={r:0,s:0,a:0},idleT=null,last=0;
const COL=['#ffffff','#bfe3ff','#ffe2b8','#ffc4e8'];
const stars=Array.from({length:110},()=>{const z=Math.random();return{x:Math.random()*W,y:Math.random()*H,s:12+z*80,z,c:COL[Math.random()*4|0]}});

let tm=0,shake=0,rings=[],met=null;
function glow(c1,c2){const r=14,o=document.createElement('canvas');o.width=o.height=r*2;const g=o.getContext('2d'),gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,'#fff');gr.addColorStop(.25,c1);gr.addColorStop(.55,c2);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);return o}
const SP=[glow('#ff8fb1','rgba(255,61,113,.7)'),glow('#c4b0ff','rgba(138,92,255,.7)'),glow('#ffd37a','rgba(255,150,40,.7)'),glow('#8ff3ff','rgba(53,224,255,.7)')];
const BG=(()=>{const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1b0a45');gr.addColorStop(.55,'#0a0a24');gr.addColorStop(1,'#03050d');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const neb=[[70,150,170,90,.5,'138,92,255',.28],[300,300,190,80,-.6,'53,224,255',.16],[110,430,200,70,.3,'255,61,150',.14],[260,90,120,70,-.3,'255,140,220',.14],[200,600,230,80,-.2,'90,70,255',.18]];
  for(const [x,y,rx,ry,rot,c,a] of neb){g.save();g.translate(x,y);g.rotate(rot);g.scale(1,ry/rx);
    gr=g.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,'rgba('+c+','+a+')');gr.addColorStop(.6,'rgba('+c+','+a*.4+')');gr.addColorStop(1,'rgba('+c+',0)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,6.283);g.fill();g.restore()}
  const px=292,py=545,pr=62;
  const ring=(a0,a1)=>{g.save();g.translate(px,py);g.rotate(-.35);g.scale(1,.28);
    g.strokeStyle='rgba(190,200,255,.35)';g.lineWidth=14;g.beginPath();g.arc(0,0,pr*1.55,a0,a1);g.stroke();
    g.strokeStyle='rgba(255,200,230,.2)';g.lineWidth=5;g.beginPath();g.arc(0,0,pr*1.78,a0,a1);g.stroke();g.restore()};
  gr=g.createRadialGradient(px,py,pr,px,py,pr*1.5);gr.addColorStop(0,'rgba(120,150,255,.25)');gr.addColorStop(1,'rgba(120,150,255,0)');
  g.fillStyle=gr;g.beginPath();g.arc(px,py,pr*1.5,0,6.283);g.fill();
  ring(Math.PI,6.283);
  gr=g.createRadialGradient(px-pr*.5,py-pr*.5,pr*.1,px,py,pr);gr.addColorStop(0,'#6a77d8');gr.addColorStop(.5,'#2b2f78');gr.addColorStop(1,'#0a0b25');
  g.fillStyle=gr;g.beginPath();g.arc(px,py,pr,0,6.283);g.fill();
  g.save();g.beginPath();g.arc(px,py,pr,0,6.283);g.clip();g.fillStyle='rgba(160,180,255,.08)';
  for(let k=0;k<5;k++)g.fillRect(px-pr,py-pr+10+k*24,pr*2,8);g.restore();
  ring(0,Math.PI);
  gr=g.createRadialGradient(52,322,1,60,330,14);gr.addColorStop(0,'#c9cdf5');gr.addColorStop(1,'#2a2c55');
  g.fillStyle=gr;g.beginPath();g.arc(60,330,11,0,6.283);g.fill();
  return o})();

function show(id){['intro','dead','end'].forEach(i=>$(i).classList.toggle('on',i===id))}
function start(){
  attempt++;t=0;bul=[];parts=[];P.x=W/2;P.y=H-100;acc={r:0,s:0,a:0};st='play';show(null);
}
function finish(win){
  st='end';
  $('etit').textContent=win?'Ты прошёл!':'Так близко!';
  $('esub').textContent='Полная версия ждёт тебя';
  show('end');
}
function die(){
  st='dead';
  boom();
  if(attempt<2){
    $('dtxt').textContent='Почти! Ещё одна попытка?';
    show('dead');
    idleT=setTimeout(()=>finish(false),6000); // автоCTA, если игрок завис
  }else finish(false);
}
$('intro').addEventListener('pointerdown',start);
$('retry').addEventListener('click',()=>{clearTimeout(idleT);start()});
$('install').addEventListener('click',cta);

// управление: относительное смещение, палец не закрывает кораблик
let lx=0,ly=0;
addEventListener('pointerdown',e=>{lx=e.clientX;ly=e.clientY});
addEventListener('pointermove',e=>{
  if(st==='play'&&e.buttons!==0||st==='play'&&e.pointerType==='touch'){
    const k=W/cv.getBoundingClientRect().width;
    P.x=Math.max(8,Math.min(W-8,P.x+(e.clientX-lx)*k));
    P.y=Math.max(8,Math.min(H-8,P.y+(e.clientY-ly)*k));
  }
  lx=e.clientX;ly=e.clientY;
});

const bx=()=>W/2+Math.sin(t*0.8)*90, by=110;
function spawn(a,s,c){bul.push({x:bx(),y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c})}

function update(dt){
  t+=dt;
  const k=attempt>1?0.72:1;           // вторая попытка легче
  const fast=t>11?1.5:1;              // финальный всплеск
  acc.r+=dt;
  if(acc.r>0.9/fast){acc.r=0;for(let i=0;i<14;i++)spawn(t+i*6.283/14,90*k,0)}
  if(t>2){
    acc.s+=dt;
    if(acc.s>0.09){acc.s=0;spawn(t*2.5,110*k,1);if(t>9)spawn(-t*2.5+3.14,110*k,3)}
  }
  if(t>5){
    acc.a+=dt;
    if(acc.a>1.2){acc.a=0;const a=Math.atan2(P.y-by,P.x-bx());for(let i=-1;i<=1;i++)spawn(a+i*0.18,170*k,2)}
  }
  for(const b of bul){b.x+=b.vx*dt;b.y+=b.vy*dt}
  bul=bul.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  for(const b of bul){
    const dx=b.x-P.x,dy=b.y-P.y;
    if(dx*dx+dy*dy<56){die();return}
  }
  if(t>=T)finish(true);
}

function boom(){
  shake=.4;rings.push({x:P.x,y:P.y,l:.5});
  for(let i=0;i<60;i++){const a=Math.random()*6.283,v=30+Math.random()*200;
    parts.push({x:P.x,y:P.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.6,c:i%2?'#8ff3ff':'#ffd37a',z:1+Math.random()*2.5})}
}
function boss(){
  const x=bx(),y=by,p=1+Math.sin(tm*4)*.05,f=Math.max(0,1-acc.r*5); // f: вспышка после залпа
  let g;
  ctx.globalCompositeOperation='lighter';
  g=ctx.createRadialGradient(x,y,6,x,y,84);
  g.addColorStop(0,'rgba(170,110,255,'+(.5+f*.3)+')');g.addColorStop(.5,'rgba(255,61,150,'+(.12+f*.1)+')');g.addColorStop(1,'rgba(170,110,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,84,0,6.283);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  for(const d of[-1,1]){ // крылья
    const fl=Math.sin(tm*3)*7;
    g=ctx.createLinearGradient(x,y,x+d*68,y);g.addColorStop(0,'#5b2bd6');g.addColorStop(1,'rgba(255,61,150,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+d*14,y-6);
    ctx.quadraticCurveTo(x+d*50,y-34+fl,x+d*68,y-14+fl*.6);
    ctx.quadraticCurveTo(x+d*50,y-6,x+d*60,y+8);
    ctx.quadraticCurveTo(x+d*40,y+4,x+d*48,y+22);
    ctx.quadraticCurveTo(x+d*28,y+14,x+d*14,y+14);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,170,220,.6)';ctx.lineWidth=1.2;ctx.stroke();
  }
  ctx.lineCap='round';
  for(let r=0;r<2;r++){ // броня-кольца
    const dir=r?-1:1;ctx.lineWidth=r?2:3.5;ctx.strokeStyle=r?'rgba(120,230,255,.85)':'rgba(255,140,200,.95)';
    for(let i=0;i<4;i++){const a=tm*dir*(1.2+r*.6)+i*1.5708;ctx.beginPath();ctx.arc(x,y,29+r*8,a,a+.95);ctx.stroke()}
  }
  ctx.lineCap='butt';
  g=ctx.createRadialGradient(x-7,y-8,2,x,y,21*p);
  g.addColorStop(0,'#fff');g.addColorStop(.25,'#d7bcff');g.addColorStop(.7,'#6a34e6');g.addColorStop(1,'#2a0e73');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,21*p,0,6.283);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,21*p,0,6.283);ctx.clip();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=3;
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x+Math.cos(tm*.9+i*2.1)*9,y+Math.sin(tm*.9+i*2.1)*9,10,0,6.283);ctx.stroke()}
  ctx.restore();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){ // кристаллы на орбите
    const a=tm*.9+i*1.047,sx=x+Math.cos(a)*(46+Math.sin(tm*2+i)*3),sy=y+Math.sin(a)*26,sz=4+Math.sin(a)*1.5;
    ctx.drawImage(SP[i%2?1:3],sx-10,sy-10,20,20);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();
    ctx.moveTo(sx,sy-sz*1.6);ctx.lineTo(sx+sz,sy);ctx.lineTo(sx,sy+sz*1.6);ctx.lineTo(sx-sz,sy);ctx.closePath();ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  const ex=Math.max(-4,Math.min(4,(P.x-x)/28)),ey=Math.max(-2,Math.min(3,(P.y-y)/200));
  g=ctx.createRadialGradient(x+ex,y+ey,1,x+ex,y+ey,10);
  g.addColorStop(0,'#fff176');g.addColorStop(.5,'#ff8a1f');g.addColorStop(1,'#d3123e');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,11,6+f*3+Math.sin(tm*3)*.8,0,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(30,5,70,.8)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#10051f';ctx.beginPath();ctx.ellipse(x+ex,y+ey,2+f*1.5,5+f*.8,0,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(x+ex-3,y+ey-2.5,1.5,0,6.283);ctx.fill();
}
function ship(){
  const x=P.x,y=P.y,fl=8+Math.random()*6;
  ctx.globalCompositeOperation='lighter';
  let g=ctx.createLinearGradient(0,y+8,0,y+14+fl);
  g.addColorStop(0,'rgba(120,230,255,.95)');g.addColorStop(1,'rgba(120,230,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-4,y+8);ctx.lineTo(x,y+14+fl);ctx.lineTo(x+4,y+8);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  g=ctx.createLinearGradient(x-15,0,x+15,0);g.addColorStop(0,'#2a6df4');g.addColorStop(.5,'#8fe9ff');g.addColorStop(1,'#2a6df4');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(x,y-14);ctx.lineTo(x+5,y-2);ctx.lineTo(x+15,y+10);ctx.lineTo(x+6,y+7);ctx.lineTo(x+3,y+11);
  ctx.lineTo(x-3,y+11);ctx.lineTo(x-6,y+7);ctx.lineTo(x-15,y+10);ctx.lineTo(x-5,y-2);ctx.closePath();ctx.fill();
  ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.stroke();
  ctx.fillStyle='#0b1b3a';ctx.beginPath();ctx.ellipse(x,y-6,2.5,4,0,0,6.283);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,2.5,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(x,y,6.5+Math.sin(tm*8)*.6,0,6.283);ctx.stroke();
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);
  ctx.drawImage(BG,0,0);
  ctx.fillStyle='#fff';
  for(const s of stars){ctx.globalAlpha=(.3+.7*s.z)*(.7+.3*Math.sin(tm*3+s.x));ctx.fillStyle=s.c;const q=1+s.z*1.5;ctx.fillRect(s.x,s.y,q,q);
    if(s.z>.93){ctx.fillRect(s.x-3,s.y+q/2-.4,q+6,.8);ctx.fillRect(s.x+q/2-.4,s.y-3,.8,q+6)}}
  ctx.globalAlpha=1;
  if(met){const m=ctx.createLinearGradient(met.x,met.y,met.x+60,met.y-84);m.addColorStop(0,'rgba(255,255,255,.9)');m.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=m;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(met.x,met.y);ctx.lineTo(met.x+60,met.y-84);ctx.stroke()}
  boss();
  ctx.globalCompositeOperation='lighter';
  for(const b of bul)ctx.drawImage(SP[b.c],b.x-11,b.y-11,22,22);
  ctx.globalCompositeOperation='source-over';
  if(st!=='dead')ship();
  if(st==='play'||st==='dead'){
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(20,20,W-40,6);
    const g=ctx.createLinearGradient(20,0,W-20,0);g.addColorStop(0,'#35e0ff');g.addColorStop(1,'#ff3d71');
    ctx.fillStyle=g;ctx.fillRect(20,20,(W-40)*Math.min(t/T,1),6);
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ctx.globalAlpha=Math.min(p.l*1.5,1);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.z,p.z)}
  for(const r of rings){ctx.globalAlpha=Math.max(r.l*2,0);ctx.strokeStyle='#8ff3ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,(.5-r.l)*220,0,6.283);ctx.stroke()}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

function loop(ts){
  const dt=Math.min((ts-last)/1000||0,0.033);last=ts;
  if(st==='play')update(dt);
  for(const s of stars){s.y+=s.s*dt;if(s.y>H)s.y=0}
  tm+=dt;shake=Math.max(shake-dt,0);
  if(!met&&Math.random()<.008)met={x:Math.random()*W+60,y:-10,l:.8};
  if(met){met.x-=300*dt;met.y+=420*dt;met.l-=dt;if(met.l<=0||met.y>H)met=null}
  if(st==='play'&&Math.random()<.8)parts.push({x:P.x+(Math.random()-.5)*5,y:P.y+10,vx:(Math.random()-.5)*20,vy:70+Math.random()*50,l:.35,c:'#7de8ff',z:2});
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const r of rings)r.l-=dt;
  rings=rings.filter(r=>r.l>0);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
